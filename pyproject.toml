[project]
name = "pyrolab"
version = "0.4.0"
description = "A framework for using remote lab instruments as local resources built on Pyro5."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0+"}
keywords = [
  "PyroLab", 
  "Pyro5", 
  "Pyro", 
  "lab", 
  "instrument", 
  "remote", 
  "resources", 
  "framework", 
  "laboratory", 
  "instrumentation", 
  "hardware", 
  "science", 
  "remote", 
  "network", 
  "integration",
]

# This should be your name or the name of the organization who originally
# authored the project, and a valid email address corresponding to the name
# listed.
authors = [
  {name = "Sequoia Ploeg", email = "sequoiap4@gmail.com" },
  {name = "BYU CamachoLab", email = "camacho@byu.edu"}
]

# This should be your name or the names of the organization who currently
# maintains the project, and a valid email address corresponding to the name
# listed.
maintainers = [
  {name = "Sequoia Ploeg", email = "sequoiap4@gmail.com" },
  {name = "BYU CamachoLab", email = "camacho@byu.edu"}
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy",
  "scipy",
  "Pyro5",
  "pydantic>=2.8,<3",
  "pyyaml",
  "deprecation",
  "typer",
  "colorama",
  "tabulate",
  "requests",
  "packaging>=23.0",
  "platformdirs>=3.0",
]

# Optional hardware dependencies, installed with the "extras" syntax, e.g.
#
#   $ pip install pyrolab[arduino]
[project.optional-dependencies]
tsl550 = ["pyserial"]
ppcl55x = ["pyserial"]
# thorlabs = ["thorlabs_kinesis@git+https://github.com/BYUCamachoLab/thorlabs-kinesis"]
rto = ["pyvisa", "pyvisa-py"]
arduino = ["pyfirmata"]
cameras = ["opencv-python"]
# adiscovery = ["WF_SDK@git+https://github.com/Digilent/WaveForms-SDK-Getting-Started-PY#egg=WF_SDK"]
# monitor = ["pyromonitor@git+https://github.com/BYUCamachoLab/pyromonitor"]

# Development-only dependencies; not published. `uv sync` installs "dev" by
# default; add `--group docs` for the documentation toolchain.
[dependency-groups]
dev = [
  "coverage",
  "mypy",
  "pre-commit",
  "pytest",
  "ruff==0.16.10",  # keep in step with .pre-commit-config.yaml
]
docs = [
  "jupyter-book == 1.0.3",
  "notebook",
  "numpydoc==1.5.0",
]

[tool.setuptools.packages.find]
include = ["pyrolab"]
namespaces = false

[project.urls]
"Homepage" = "https://pyrolab.readthedocs.io/en/latest/"
"Documentation" = "https://pyrolab.readthedocs.io/en/latest/"
"Source" = "https://github.com/BYUCamachoLab/pyrolab"
"Bug Reports" = "https://github.com/BYUCamachoLab/pyrolab/issues"
"Research Group" = "https://camacholab.byu.edu/"

[project.scripts]
pyrolab = "pyrolab.cli:run"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--maxfail=2 -rf"
testpaths = ["tests"]
console_output_style = "progress"
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
# A test running longer than this dumps every thread's traceback to stderr,
# so a hang shows where it is stuck instead of silently running until CI's
# job timeout.
faulthandler_timeout = 60
markers = [
  "hardware: needs physical lab instruments; skipped unless --run-hardware is given",
]

[tool.coverage.run]
source = ["pyrolab"]

[tool.coverage.report]
skip_empty = true

[build-system]
requires = ["setuptools>=62.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Import sorting only, replacing isort. Ruff's default rule set is not
# enabled yet.
select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["pyrolab"]

[tool.ruff.lint.per-file-ignores]
# Import order in api.py is load-bearing.
"pyrolab/api.py" = ["I"]
