repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
    # PyroLab configs may repeat "auto" keys (each becomes a random unique
    # name), which plain YAML rejects as duplicates.
    exclude: ^tests/data/devconfig\.yaml$
  - id: check-json
  - id: check-merge-conflict
  - id: mixed-line-ending
  - id: end-of-file-fixer
    files: pyrolab/.*
  - id: trailing-whitespace
    files: pyrolab/.*

# Keep rev in step with the ruff pin in pyproject.toml's dev dependency group.
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.10
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format

