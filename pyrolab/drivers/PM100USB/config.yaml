version: '1.0'

nameservers:
  production:
    host: 0.0.0.0        
    ns_port: 9090
    broadcast: true      
    ns_bchost: 0.0.0.0
    ns_bcport: 9091
    ns_autoclean: 0.0
    storage: memory

daemons:
  lockable:
    module: pyrolab.server
    classname: LockableDaemon
    host: 0.0.0.0        
    port: 0
    unixsocket: null
    nathost: null
    natport: 0
    servertype: thread
    nameservers:
      - production

services:
  thorlabs_pmx_driver:
    module: thorlabs_pmx_driver
    classname: ThorlabsPMX
    description: Driver for Power Meter
    instancemode: single
    daemon: lockable
    nameservers:
      - production

autolaunch:
  nameservers:
    - production
  daemons:
    - lockable
