name: release

on:
  push:
    tags:
      - "v*"
  # Dry runs: build and run the release checks without publishing anything.
  # Runs on any PR that edits this file, so changes to the release process are
  # exercised before the next real release.
  pull_request:
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    # PRs already run tests.yml; repeat it only before a real release.
    if: github.event_name == 'push'
    uses: ./.github/workflows/tests.yml

  build:
    name: Build and check
    needs: tests
    # Runs when tests passed, or were skipped on a dry run.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Check version and changelog
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(uv version --short)
          if [ "$REF_TYPE" = tag ] && [ "v$VERSION" != "$REF_NAME" ]; then
            echo "::error::Tag $REF_NAME does not match pyproject.toml version $VERSION"
            exit 1
          fi
          NOTES="docs/changelog/$VERSION-changelog.md"
          if [ ! -s "$NOTES" ]; then
            echo "::error::$NOTES is missing or empty; it becomes the GitHub release notes"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build
        # --no-sources builds exactly what PyPI users will get, ignoring any
        # development-only [tool.uv.sources] overrides.
        run: uv build --no-sources
      - name: Check distributions
        # Catches metadata and README rendering problems PyPI would reject.
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyrolab/${{ needs.build.outputs.version }}/
    permissions:
      # Trusted Publishing: PyPI exchanges this job's OIDC token for a
      # short-lived upload token, so no PyPI secret is stored in the repo.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  github-release:
    name: Create GitHub release
    needs: [build, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "PyroLab $VERSION" \
            --notes-file "docs/changelog/$VERSION-changelog.md"
