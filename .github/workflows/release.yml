name: release

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    name: Create Release
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Get version number
        id: get_version
        run: |
          VERSION=$(uv version --short)
          if [ "v$VERSION" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match pyproject.toml version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Build
        # --no-sources builds exactly what PyPI users will get, ignoring any
        # development-only [tool.uv.sources] overrides.
        run: uv build --no-sources
      - name: Load Release text
        id: get_text
        run: |
          BODY=$(cat ./docs/changelog/${{ env.VERSION }}-changelog.md)
          BODY="${BODY//'%'/'%25'}"
          BODY="${BODY//$'\n'/'%0A'}"
          BODY="${BODY//$'\r'/'%0D'}"
          echo "BODY=$BODY" >> $GITHUB_OUTPUT
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.5.0
        with:
          user: __token__
          password: ${{ secrets.PYPI_PASSWORD }}
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: ${{ github.ref }}
          release_name: PyroLab ${{ env.VERSION }}
          body: ${{ env.BODY }}
          draft: false
          prerelease: false
