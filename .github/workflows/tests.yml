name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Lets release.yml require a passing run before publishing.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned to match .pre-commit-config.yaml.
      - run: pip install black==23.3.0
      - run: black --check --diff pyrolab tests

  test:
    name: pytest (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run tests
        # --maxfail=0 overrides the --maxfail=2 in pyproject.toml so CI
        # reports every failure, not just the first two.
        run: coverage run -m pytest --maxfail=0 -rs
      - name: Coverage report
        run: coverage report
